<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOVE SALON 打卡系統</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 80px 20px;
            box-sizing: border-box;
        }

        .checkin-container {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 360px;
            padding: 40px 25px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
            text-align: center;
            border: 1px solid #333;
        }

        /* LOGO 區塊 */
        .logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .logo-image {
            max-width: 180px; /* 控制 Logo 寬度 */
            height: auto;
            filter: invert(100%) brightness(120%) contrast(110%); /* 強制反白，並調整亮度和對比度 */
            drop-shadow(0 0 10px rgba(61, 133, 247, 0.4)); /* 增加柔和藍色光暈 */
        }

        h2 {
            margin: 0 0 8px 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 40px;
        }

        select {
            width: 100%;
            padding: 16px;
            margin-bottom: 45px;
            font-size: 17px;
            border-radius: 12px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #ffffff;
            appearance: none;
            -webkit-appearance: none;
            text-align: center;
            outline: none;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
        }

        .btn-action {
            width: 100%;
            padding: 20px 0;
            font-size: 19px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        .btn-on {
            background: #3d85f7;
            box-shadow: 0 4px 15px rgba(61, 133, 247, 0.3);
        }

        .btn-off {
            background: #eb4d4b;
            box-shadow: 0 4px 15px rgba(235, 77, 75, 0.3);
        }

        .btn-disabled {
            background: #333 !important;
            color: #666 !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }

        #cooldownMsg {
            color: #f1c40f;
            margin-top: 30px;
            font-weight: 500;
            font-size: 15px;
            background: rgba(241, 196, 15, 0.1);
            padding: 12px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="checkin-container">
        <div class="logo-container">
            <img src="https://example.com/your/path/to/image_6.png" alt="LOVE SALON LOGO" class="logo-image">
        </div>
        
        <div class="subtitle">GPS 智慧打卡系統</div>
        
        <form id="checkInForm">
            <select id="workerName" required>
                <option value="">請選擇成員</option>
                <option value="布萊德">布萊德</option>
                <option value="小岱">小岱</option>
                <option value="Una">Una</option>
                <option value="妹妹">妹妹</option>
            </select>

            <div class="btn-group">
                <button type="button" class="btn-action btn-on" data-action="上班">上班打卡</button>
                <button type="button" class="btn-action btn-off" data-action="下班">下班打卡</button>
            </div>
            <p id="cooldownMsg" style="display: none;"></p>
        </form>
    </div>

    <script>
        const buttons = document.querySelectorAll('.btn-action');
        const cooldownMsg = document.getElementById('cooldownMsg');
        const COOLDOWN_TIME = 5 * 60 * 1000; 

        function checkCooldown() {
            const lastCheckIn = localStorage.getItem('lastCheckInTime');
            if (lastCheckIn) {
                const timeLeft = COOLDOWN_TIME - (Date.now() - parseInt(lastCheckIn));
                if (timeLeft > 0) {
                    startCooldownTimer(timeLeft);
                }
            }
        }

        function startCooldownTimer(duration) {
            buttons.forEach(b => {
                b.disabled = true;
                b.classList.add('btn-disabled');
            });
            cooldownMsg.style.display = 'block';
            
            const timer = setInterval(() => {
                const timeLeft = duration - 1000;
                duration = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    buttons.forEach(b => {
                        b.disabled = false;
                        b.classList.remove('btn-disabled');
                    });
                    cooldownMsg.style.display = 'none';
                    localStorage.removeItem('lastCheckInTime');
                } else {
                    const mins = Math.floor(timeLeft / 60000);
                    const secs = Math.floor((timeLeft % 60000) / 1000);
                    cooldownMsg.innerText = `已完成打卡，請等待 ${mins}分${secs}秒`;
                }
            }, 1000);
        }

        buttons.forEach(btn => {
            btn.onclick = function() {
                const name = document.getElementById('workerName').value;
                if (!name) { alert('請先選擇您的名字！'); return; }

                const action = this.getAttribute('data-action');
                const originalText = this.innerText;
                
                buttons.forEach(b => b.disabled = true);
                this.innerText = 'GPS 驗證中...';

                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    
                    let ip = "未知";
                    try {
                        const res = await fetch('https://api.ipify.org?format=json');
                        const d = await res.json(); ip = d.ip;
                    } catch(err) {}

                    const url = 'https://script.google.com/macros/s/AKfycbwCltaFsKvURwo-WUllC5eHvPflY1k-V7UZO4-3SDDNlnzEZn5AdL4MUdUC7WyKB4fr/exec';

                    fetch(url, {
                        method: 'POST',
                        body: JSON.stringify({
                            name: name,
                            action: action,
                            location: lat + "," + lon,
                            ip: ip,
                            device: navigator.userAgent
                        })
                    })
                    .then(response => response.text())
                    .then(msg => {
                        // 處理回傳訊息，增加距離提示邏輯
                        alert(msg); 
                        if(msg.includes("成功")) {
                            localStorage.setItem('lastCheckInTime', Date.now());
                            startCooldownTimer(COOLDOWN_TIME);
                        } else if(msg.includes("距離")) {
                            // 當 Apps Script 修改後，這裡可以彈出精確距離
                            // 目前Apps Script尚未修改，所以先保持原本alert
                            // alert('您距離辦公室太遠，請移動到店內再試');
                        } else {
                            buttons.forEach(b => b.disabled = false);
                        }
                        this.innerText = originalText;
                    });
                }, () => {
                    alert('失敗：請確保手機已開啟定位權限');
                    buttons.forEach(b => b.disabled = false);
                    this.innerText = originalText;
                });
            };
        });

        checkCooldown();
    </script>
</body>
</html>
