<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOVE SALON 打卡系統</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 80px 24px;
            box-sizing: border-box;
        }

        .checkin-container {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 360px;
            padding: 50px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #333;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 300;
            letter-spacing: 5px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 11px;
            color: #555;
            letter-spacing: 3px;
            margin: 10px 0 50px 0;
        }

        select {
            width: 100%;
            padding: 16px;
            margin-bottom: 40px;
            font-size: 16px;
            border-radius: 12px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #ffffff;
            appearance: none;
            -webkit-appearance: none;
            text-align-last: center;
            outline: none;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .btn-action {
            width: 100%;
            padding: 20px 0;
            font-size: 18px;
            border: none;
            border-radius: 16px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* 上班：Gemini 藍 */
        .btn-on { background: #4285f4; box-shadow: 0 4px 15px rgba(66,133,244,0.2); }
        
        /* 下班：磨砂暗紅 */
        .btn-off { background: #8b1a1a; box-shadow: 0 4px 15px rgba(139,26,26,0.2); }

        .btn-action:active { transform: scale(0.96); opacity: 0.8; }

        /* 倒數計時狀態：完全灰階、無光暈 */
        .btn-disabled { 
            background: #333 !important; 
            color: #666 !important; 
            cursor: not-allowed; 
            filter: grayscale(100%); /* 強制灰階 */
            box-shadow: none !important; /* 移除光暈 */
            transform: none !important;
        }

        #cooldownMsg {
            color: #8ab4f8;
            margin-top: 30px;
            font-size: 14px;
            background: rgba(138,180,248,0.1);
            padding: 12px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="checkin-container">
        <h1>LOVE SALON</h1>
        <div class="subtitle">STAFF ONLY</div>
        <form id="checkInForm">
            <select id="workerName" required>
                <option value="">選擇成員</option>
                <option value="布萊德">布萊德</option>
                <option value="小岱">小岱</option>
                <option value="Una">Una</option>
                <option value="妹妹">妹妹</option>
            </select>
            <div class="btn-group">
                <button type="button" class="btn-action btn-on" data-action="上班">上班</button>
                <button type="button" class="btn-action btn-off" data-action="下班">下班</button>
            </div>
            <p id="cooldownMsg" style="display: none;"></p>
        </form>
    </div>

    <script>
        const buttons = document.querySelectorAll('.btn-action');
        const cooldownMsg = document.getElementById('cooldownMsg');
        const COOLDOWN_TIME = 5 * 60 * 1000; 

        function checkCooldown() {
            const lastTime = localStorage.getItem('lastCheckInTime');
            if (lastTime) {
                const timeLeft = COOLDOWN_TIME - (Date.now() - parseInt(lastTime));
                if (timeLeft > 0) startCooldownTimer(timeLeft);
            }
        }

        function startCooldownTimer(duration) {
            buttons.forEach(b => { 
                b.disabled = true; 
                b.classList.add('btn-disabled'); 
            });
            cooldownMsg.style.display = 'block';
            const timer = setInterval(() => {
                const left = duration - 1000;
                duration = left;
                if (left <= 0) {
                    clearInterval(timer);
                    buttons.forEach(b => { 
                        b.disabled = false; 
                        b.classList.remove('btn-disabled'); 
                    });
                    cooldownMsg.style.display = 'none';
                    localStorage.removeItem('lastCheckInTime');
                } else {
                    const m = Math.floor(left / 60000);
                    const s = Math.floor((left % 60000) / 1000);
                    cooldownMsg.innerText = `冷卻中：${m}分${s}秒`;
                }
            }, 1000);
        }

        buttons.forEach(btn => {
            btn.onclick = async function() {
                const name = document.getElementById('workerName').value;
                if (!name) { alert('請選擇名字'); return; }
                const action = this.getAttribute('data-action');
                
                buttons.forEach(b => b.disabled = true);
                this.innerText = '驗證中...';

                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    
                    const url = 'https://script.google.com/macros/s/AKfycbwCltaFsKvURwo-WUllC5eHvPflY1k-V7UZO4-3SDDNlnzEZn5AdL4MUdUC7WyKB4fr/exec';

                    fetch(url, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify({
                            name: name,
                            action: action,
                            location: lat + "," + lon
                        })
                    })
                    .then(() => {
                        // 移除所有 alert，直接進入倒數
                        localStorage.setItem('lastCheckInTime', Date.now());
                        startCooldownTimer(COOLDOWN_TIME);
                        this.innerText = action;
                    })
                    .catch(err => {
                        alert("連線失敗");
                        buttons.forEach(b => b.disabled = false);
                        this.innerText = action;
                    });

                }, (err) => {
                    alert('失敗：請開啟 GPS 定位');
                    buttons.forEach(b => b.disabled = false);
                    this.innerText = action;
                }, { enableHighAccuracy: true, timeout: 10000 });
            };
        });
        checkCooldown();
    </script>
</body>
</html>
