<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS 驗證打卡</title>
</head>
<body style="text-align: center; padding-top: 50px; font-family: sans-serif;">
    <h2>📍 辦公室區域打卡</h2>
    <form id="checkInForm">
        <select id="workerName" style="width: 80%; padding: 15px; margin-bottom: 20px; font-size: 16px;" required>
            <option value="">請選擇姓名</option>
            <option value="老王">老王</option>
            <option value="小明">小明</option>
        </select><br>
        <button type="submit" id="btn" style="width: 80%; padding: 20px; background: #007bff; color: white; font-size: 18px; border: none; border-radius: 8px;">取得位置並打卡</button>
    </form>

    <script>
        document.getElementById('checkInForm').onsubmit = function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn');
            btn.disabled = true; btn.innerText = '定位與驗證中...';

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                
                let ip = "未知";
                try {
                    const res = await fetch('https://api.ipify.org?format=json');
                    const d = await res.json(); ip = d.ip;
                } catch(err) {}

                const url = 'https://script.google.com/macros/s/AKfycbwCltaFsKvURwo-WUllC5eHvPflY1k-V7UZO4-3SDDNlnzEZn5AdL4MUdUC7WyKB4fr/exec';

                // 改用傳送資料並接收回傳訊息
                fetch(url, {
                    method: 'POST',
                    body: JSON.stringify({
                        name: document.getElementById('workerName').value,
                        action: "上班",
                        location: lat + "," + lon,
                        ip: ip,
                        device: navigator.userAgent
                    })
                })
                .then(response => response.text())
                .then(msg => {
                    alert(msg); // 顯示 Google 回傳的「成功」或「距離太遠」
                    if(msg.includes("成功")) location.reload();
                    btn.disabled = false; btn.innerText = '取得位置並打卡';
                });
            }, () => {
                alert('錯誤：請開啟手機 GPS 權限');
                btn.disabled = false; btn.innerText = '重試';
            });
        };
    </script>
</body>
</html>
