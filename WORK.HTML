<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOVE SALON 打卡系統</title>
    <style>
        body {
            background-color: #121212; /* 深黑色背景 */
            color: #ffffff;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 80px 24px;
            box-sizing: border-box;
        }

        .checkin-container {
            background-color: #1e1e1e; /* 深灰卡片 */
            width: 100%;
            max-width: 360px;
            padding: 50px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 1px solid #333;
        }

        /* 純文字 Logo 風格 */
        h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 300; /* 輕量字體更優雅 */
            letter-spacing: 4px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 12px;
            color: #666;
            letter-spacing: 2px;
            margin-top: 10px;
            margin-bottom: 50px;
        }

        select {
            width: 100%;
            padding: 16px;
            margin-bottom: 40px;
            font-size: 16px;
            border-radius: 12px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #ffffff;
            appearance: none;
            -webkit-appearance: none;
            text-align-last: center; /* 文字置中 */
            outline: none;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-action {
            width: 100%;
            padding: 22px 0;
            font-size: 18px;
            border: none;
            border-radius: 16px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* 推薦配色：Gemini 藍 */
        .btn-on {
            background: #4285f4; 
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.2);
        }

        /* 推薦配色：消光深灰 (取代亮紅) */
        .btn-off {
            background: #3c4043; 
            border: 1px solid #5f6368;
        }

        .btn-action:active {
            transform: scale(0.96);
            opacity: 0.8;
        }

        .btn-disabled {
            background: #222 !important;
            color: #444 !important;
            border: none !important;
            box-shadow: none !important;
        }

        #cooldownMsg {
            color: #8ab4f8; /* 淺藍色提示 */
            margin-top: 30px;
            font-size: 14px;
            background: rgba(138, 180, 248, 0.1);
            padding: 12px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="checkin-container">
        <h1>LOVE SALON</h1>
        <div class="subtitle">STAFF ONLY</div>
        
        <form id="checkInForm">
            <select id="workerName" required>
                <option value="">選擇成員</option>
                <option value="布萊德">布萊德</option>
                <option value="小岱">小岱</option>
                <option value="Una">Una</option>
                <option value="妹妹">妹妹</option>
            </select>

            <div class="btn-group">
                <button type="button" class="btn-action btn-on" data-action="上班">上班</button>
                <button type="button" class="btn-action btn-off" data-action="下班">下班</button>
            </div>
            <p id="cooldownMsg" style="display: none;"></p>
        </form>
    </div>

    <script>
        // 腳本邏輯保持不變，維持 GPS 與 5 分鐘冷卻功能
        const buttons = document.querySelectorAll('.btn-action');
        const cooldownMsg = document.getElementById('cooldownMsg');
        const COOLDOWN_TIME = 5 * 60 * 1000; 

        function checkCooldown() {
            const lastCheckIn = localStorage.getItem('lastCheckInTime');
            if (lastCheckIn) {
                const timeLeft = COOLDOWN_TIME - (Date.now() - parseInt(lastCheckIn));
                if (timeLeft > 0) startCooldownTimer(timeLeft);
            }
        }

        function startCooldownTimer(duration) {
            buttons.forEach(b => { b.disabled = true; b.classList.add('btn-disabled'); });
            cooldownMsg.style.display = 'block';
            const timer = setInterval(() => {
                const timeLeft = duration - 1000;
                duration = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    buttons.forEach(b => { b.disabled = false; b.classList.remove('btn-disabled'); });
                    cooldownMsg.style.display = 'none';
                    localStorage.removeItem('lastCheckInTime');
                } else {
                    const mins = Math.floor(timeLeft / 60000);
                    const secs = Math.floor((timeLeft % 60000) / 1000);
                    cooldownMsg.innerText = `冷卻中：${mins}分${secs}秒`;
                }
            }, 1000);
        }

        buttons.forEach(btn => {
            btn.onclick = function() {
                const name = document.getElementById('workerName').value;
                if (!name) { alert('請選擇名字'); return; }
                const action = this.getAttribute('data-action');
                const originalText = this.innerText;
                buttons.forEach(b => b.disabled = true);
                this.innerText = '驗證中...';

                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const url = 'https://script.google.com/macros/s/AKfycbwCltaFsKvURwo-WUllC5eHvPflY1k-V7UZO4-3SDDNlnzEZn5AdL4MUdUC7WyKB4fr/exec';

                    fetch(url, {
                        method: 'POST',
                        body: JSON.stringify({ name: name, action: action, location: lat + "," + lon })
                    })
                    .then(response => response.text())
                    .then(msg => {
                        alert(msg); 
                        if(msg.includes("成功")) {
                            localStorage.setItem('lastCheckInTime', Date.now());
                            startCooldownTimer(COOLDOWN_TIME);
                        } else {
                            buttons.forEach(b => b.disabled = false);
                        }
                        this.innerText = originalText;
                    });
                }, () => {
                    alert('失敗：請開啟 GPS');
                    buttons.forEach(b => b.disabled = false);
                    this.innerText = originalText;
                });
            };
        });
        checkCooldown();
    </script>
</body>
</html>
