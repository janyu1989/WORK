<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOVE SALON</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; margin: 0; display: flex; justify-content: center; padding-top: 80px; }
        .container { background-color: #1e1e1e; width: 85%; max-width: 350px; padding: 50px 30px; border-radius: 24px; text-align: center; border: 1px solid #333; }
        h1 { font-size: 30px; letter-spacing: 5px; font-weight: 300; margin: 0; }
        .subtitle { font-size: 11px; color: #555; letter-spacing: 3px; margin: 10px 0 50px 0; }
        select { width: 100%; padding: 16px; margin-bottom: 40px; font-size: 16px; border-radius: 12px; border: 1px solid #444; background: #2a2a2a; color: white; text-align-last: center; outline: none; }
        .btn-group { display: flex; flex-direction: column; gap: 18px; }
        .btn { width: 100%; padding: 20px 0; font-size: 18px; border: none; border-radius: 16px; color: white; cursor: pointer; transition: all 0.3s; }
        .btn-on { background: #4285f4; box-shadow: 0 4px 15px rgba(66,133,244,0.3); }
        .btn-off { background: #8b1a1a; box-shadow: 0 4px 15px rgba(139,26,26,0.3); }
        /* 倒數狀態：灰階、無光暈 */
        .btn:disabled { background: #333 !important; color: #666 !important; filter: grayscale(100%); box-shadow: none !important; cursor: not-allowed; }
        #msg { color: #8ab4f8; margin-top: 30px; font-size: 14px; display: none; background: rgba(138,180,248,0.1); padding: 12px; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>LOVE SALON</h1>
        <div class="subtitle">STAFF ONLY</div>
        <select id="worker">
            <option value="">選擇成員</option>
            <option value="布萊德">布萊德</option>
            <option value="小岱">小岱</option>
            <option value="Una">Una</option>
            <option value="妹妹">妹妹</option>
        </select>
        <div class="btn-group">
            <button class="btn btn-on" onclick="sendAction('上班')">上班</button>
            <button class="btn btn-off" onclick="sendAction('下班')">下班</button>
        </div>
        <p id="msg"></p>
    </div>

    <script>
        // 1. 請在此填入您的後端網址
        const url = '您的部署網址'; 
        const btns = document.querySelectorAll('.btn');
        const msgDisplay = document.getElementById('msg');

        async function sendAction(act) {
            const name = document.getElementById('worker').value;
            if (!name) { alert('請選擇名字'); return; }
            
            // 停用按鈕並顯示狀態
            btns.forEach(b => b.disabled = true);
            msgDisplay.style.display = 'block';
            msgDisplay.innerText = 'GPS 驗證中...';

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const loc = pos.coords.latitude + "," + pos.coords.longitude;
                const deviceStr = navigator.userAgent; // 獲取裝置資訊
                let ipAddr = "擷取失敗";

                // 嘗試獲取 IP，設定 3 秒超時避免卡死
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 3000);
                    const response = await fetch('https://api.ipify.org?format=json', { signal: controller.signal });
                    const ipData = await response.json();
                    ipAddr = ipData.ip;
                    clearTimeout(timeoutId);
                } catch(e) { console.log("IP fetch failed or timed out"); }

                // 發送至後端 (與您的 doPost 參數對齊)
                fetch(url, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({
                        name: name,
                        action: act,
                        location: loc,
                        ip: ipAddr,
                        device: deviceStr
                    })
                }).then(() => {
                    // 紀錄成功時間並開始倒數
                    localStorage.setItem('salon_last_check', Date.now());
                    startTimer(5 * 60 * 1000);
                }).catch(err => {
                    alert('傳送失敗，請檢查網路');
                    btns.forEach(b => b.disabled = false);
                    msgDisplay.style.display = 'none';
                });

            }, (err) => {
                alert('定位失敗，請確保已開啟 GPS 並允許瀏覽器讀取權限');
                btns.forEach(b => b.disabled = false);
                msgDisplay.style.display = 'none';
            }, { enableHighAccuracy: true, timeout: 10000 });
        }

        function startTimer(duration) {
            btns.forEach(b => b.disabled = true);
            msgDisplay.style.display = 'block';
            const end = Date.now() + duration;

            const timer = setInterval(() => {
                const now = Date.now();
                const remain = end - now;

                if (remain <= 0) {
                    clearInterval(timer);
                    btns.forEach(b => b.disabled = false);
                    msgDisplay.style.display = 'none';
                    localStorage.removeItem('salon_last_check');
                } else {
                    const m = Math.floor(remain / 60000);
                    const s = Math.floor((remain % 60000) / 1000);
                    msgDisplay.innerText = `冷卻中：${m}分${s}秒`;
                }
            }, 1000);
        }

        // 頁面重新整理後恢復倒數
        window.onload = () => {
            const saved = localStorage.getItem('salon_last_check');
            if (saved) {
                const passed = Date.now() - parseInt(saved);
                const limit = 5 * 60 * 1000;
                if (passed < limit) {
                    startTimer(limit - passed);
                }
            }
        };
    </script>
</body>
</html>
